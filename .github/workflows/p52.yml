name: EPISTEME P52 field-guided allocation audit

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p52_trigger.txt"

permissions:
  contents: read

jobs:
  p52:
    runs-on: ubuntu-24.04
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p48_seed_fingerprints.py src/p51_sufficiency.py src/p52_allocation.py
          python src/p52_allocation.py --self-test
          python - <<'PY'
          import json
          m=json.load(open('active/p52_manifest.json'))
          assert m['stage']=='EPISTEME-P52'
          assert m['predecessor']['canonical_scientific_run']==36670782606
          assert m['execution_design']['total_scientific_calls']==8192
          assert m['primary_condition']['resolution_full_width']==0.40
          assert m['primary_condition']['budget_pairs_per_block']==512
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P52_MANIFEST_PRECHECK_PASS')
          PY
      - name: Run frozen allocation audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p52_allocation.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p52-field-guided-allocation-result
          path: receipts/p52_result.json
          retention-days: 7
