name: EPISTEME P59 zero-call completion-lattice closure

on:
  push:
    paths:
      - "active/p59_trigger.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: episteme-p59-single-run
  cancel-in-progress: false

jobs:
  p59:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: p58-failed-cell-recovery-result
          repository: WhoSia/EPISTEME
          run-id: 37403764914
          github-token: ${{ github.token }}
          path: receipts/p58_source
      - uses: actions/download-artifact@v7
        with:
          name: p55-access-regime-estimand-salvage-result
          repository: WhoSia/EPISTEME
          run-id: 37006966589
          github-token: ${{ github.token }}
          path: receipts/p55_source
      - run: pip install groq google-genai numpy
      - name: Zero-call P59 constitutional preflight
        run: |
          python -m py_compile src/p59_completion_lattice.py src/p57_analyze_shards.py src/p57_interaction_tensor.py
          python - <<'PY'
          import json
          m=json.load(open('active/p59_manifest.json'))
          assert m['stage']=='EPISTEME-P59'
          assert m['provider_calls_authorized']==0
          assert m['completion_lattice']['worlds']==4
          assert m['frozen_adjudication']['analyzer']=='src/p57_analyze_shards.py'
          assert m['governance']['repository_writeback_from_actions'] is False
          assert m['governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P59_PRECHECK_PASS')
          PY
      - name: Enumerate all four admissible completion worlds
        run: |
          python src/p59_completion_lattice.py \
            --p58-result receipts/p58_source/p58_result.json \
            --p57-recovered receipts/p58_source/p57_recovered_result.json \
            --p55 receipts/p55_source/p55_result.json \
            --out receipts/p59_result.json
      - name: Assert missingness-free closure criterion
        run: |
          python - <<'PY'
          import json
          d=json.load(open('receipts/p59_result.json'))
          assert d['provider_calls']==0
          assert d['completion_lattice']['world_count']==4
          assert d['invariance']['stopping_time_invariant'] is True
          assert d['invariance']['holm_rejection_vector_invariant'] is True
          assert d['invariance']['constitutional_branch_invariant'] is True
          assert d['identified_p57_verdict']=='OPERATOR_REVERSAL_WITH_NONTRANSPORTABLE_INTERACTION'
          assert d['p59_verdict']=='MISSINGNESS_FREE_OPERATOR_REVERSAL_WITH_NONTRANSPORTABLE_INTERACTION'
          assert d['closure_authorized'] is True
          print('P59_MISSINGNESS_FREE_CLOSURE_PASS')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: p59-completion-lattice-result
          path: receipts/p59_result.json
          retention-days: 14
