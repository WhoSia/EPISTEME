name: EPISTEME P74 P0-P2 Authority, Time and Causal Identification
on:
  push:
    paths:
      - 'src/p74_p0_observational_equivalence.py'
      - 'src/p74_p1_authority_identification_court.py'
      - 'src/p74_p2_bitemporal_federal_register_court.py'
      - 'active/p74_p69_p73_inheritance_court.md'
      - 'active/p74_p2_source_authority_rival_court.md'
      - 'active/p74_research_program.md'
      - '.github/workflows/p74_p0_nonidentification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-countermodels:
    name: P74 P0-P2 observational, authority and documentary time courts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python standard-library countermodel verification
        run: |
          python3 -m py_compile src/p74_p0_observational_equivalence.py src/p74_p1_authority_identification_court.py src/p74_p2_bitemporal_federal_register_court.py
          python3 src/p74_p0_observational_equivalence.py
          python3 src/p74_p1_authority_identification_court.py
          python3 src/p74_p2_bitemporal_federal_register_court.py
      - name: Read-only authority and no external human or provider effects
        run: |
          echo "P74 P0-P1 synthetic; P2 offline public-document metadata desk audit only. NO_REAL_FIELD_AUDIT=1"
          echo "NO_NEW_PAID_PROVIDER=1 NO_HUMAN_REVIEW=1"
