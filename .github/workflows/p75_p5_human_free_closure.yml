name: EPISTEME P75-P5 Human-free Source/Decision Closure
on:
  push:
    paths:
      - 'src/p75_p5_source_entailment_decision_closure.py'
      - 'src/p75_p5_independent_integer_audit.go'
      - 'active/p75_p5_bounded_closure_and_p76_proposal.md'
      - 'active/p75_research_program.md'
      - 'README.md'
      - '.github/workflows/p75_p5_human_free_closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-proof-and-strong-rival:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Python exact Fractions and source-relative proof counterexamples
        run: |
          python3 -m py_compile src/p75_p5_source_entailment_decision_closure.py
          python3 src/p75_p5_source_entailment_decision_closure.py > "$RUNNER_TEMP/p75_python.json"
          python3 - "$RUNNER_TEMP/p75_python.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["exact_fraction_grid"]["grid_cases"]==90
          assert j["counterexamples"]["strong_rival_exactly_ties"]
          assert j["independent_externally_certified_semantic_proofs"]==0
          assert j["new_human_recruitment"]==j["paid_new_model_calls"]==0
          assert not j["classic_full_source_bitemporal_prov_rival_defeated"]
          print("P75_P5_PYTHON_SOURCE_RELATIVE_CLASSICAL_ADEQUACY_PASS")
          PY
      - name: Independent Go integer arithmetic and source-replay audit
        run: |
          go run src/p75_p5_independent_integer_audit.go > "$RUNNER_TEMP/p75_go.json"
          python3 - "$RUNNER_TEMP/p75_python.json" "$RUNNER_TEMP/p75_go.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          g=json.load(open(sys.argv[2]))
          assert g["status"]=="PASS"
          for key in ("grid_cases","test_available_cases","test_unavailable_cases","decision_changes_with_perfect_test_offer","action_tie_cases"):
              assert p["exact_fraction_grid"][key]==g[key],(key,p["exact_fraction_grid"][key],g[key])
          assert p["exact_fraction_grid"]["conditional_perfect_test_regret"]==g["fixed_conditional_perfect_test_regret"]
          assert g["human_reviewers"]==0
          print("P75_P5_PYTHON_FRACTION_INDEPENDENT_GO_INTEGER_RESULTS_IDENTICAL")
          print("P75_P5_STRONG_STANDARD_BITEMPORAL_PROV_CLASSICAL_ADEQUACY_REMAINS")
          print("P75_P5_NO_HUMANS_NO_PAID_PROVIDER_NO_REAL_SWITCH_UTILITY")
          PY
