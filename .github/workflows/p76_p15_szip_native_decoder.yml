name: EPISTEME P76-P15 Original SZIP Decoder Probe
on:
  push:
    paths:
      - src/p76_p15_szip_native_decoder_probe.py
      - .github/workflows/p76_p15_szip_native_decoder.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y hdf4-tools libaec0
      - run: python3 src/p76_p15_szip_native_decoder_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p76-p15-native-szip-decoder-audit
          path: p76_p15_szip_native_recovery.json
