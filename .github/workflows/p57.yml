name: EPISTEME P57 interaction-basis transport

on:
  push:
    paths:
      - "active/p57_trigger.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: episteme-p57-single-run
  cancel-in-progress: false

jobs:
  task:
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        task:
          - FAULT_DIAGNOSIS_HISTORY
          - NORMALIZATION_PIPELINE
          - MATERIAL_PRECONDITIONING
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen shard preflight
        run: |
          python -m py_compile src/p57_interaction_tensor.py src/p57_task_worker.py
          python src/p57_interaction_tensor.py --self-test
          python - <<'PY'
          import json
          m=json.load(open('active/p57_manifest.json'))
          assert m['stage']=='EPISTEME-P57'
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P57_SHARD_PRECHECK_PASS')
          PY
      - name: Run one frozen task shard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p57_task_worker.py --task "${{ matrix.task }}" --out "receipts/p57_shards/${{ matrix.task }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p57-task-${{ matrix.task }}
          path: receipts/p57_shards/${{ matrix.task }}.json
          retention-days: 14

  analyze:
    if: always() && github.run_attempt == 1
    needs: task
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: p57-task-*
          path: receipts/p57_shards
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: p55-access-regime-estimand-salvage-result
          repository: WhoSia/EPISTEME
          run-id: 37006966589
          github-token: ${{ github.token }}
          path: receipts/p55_source
      - run: pip install groq google-genai numpy
      - name: Zero-provider-call combine and frozen adjudication
        run: |
          test -f receipts/p57_shards/FAULT_DIAGNOSIS_HISTORY.json
          test -f receipts/p57_shards/NORMALIZATION_PIPELINE.json
          test -f receipts/p57_shards/MATERIAL_PRECONDITIONING.json
          python -m py_compile src/p57_analyze_shards.py
          python src/p57_analyze_shards.py \
            --rows-root receipts/p57_shards \
            --p55 receipts/p55_source/p55_result.json \
            --out receipts/p57_result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p57-interaction-basis-transport-result
          path: receipts/p57_result.json
          retention-days: 14
