name: EPISTEME P57 interaction-basis transport

on:
  push:
    paths:
      - "active/p57_trigger.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: episteme-p57-single-run
  cancel-in-progress: false

jobs:
  p57:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: p55-access-regime-estimand-salvage-result
          repository: WhoSia/EPISTEME
          run-id: 37006966589
          github-token: ${{ github.token }}
          path: receipts/p55_source
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p57_interaction_tensor.py src/p53_cross_task.py src/p51_sufficiency.py
          python src/p57_interaction_tensor.py --self-test
          python - <<'PY'
          import json
          m=json.load(open('active/p57_manifest.json'))
          assert m['stage']=='EPISTEME-P57'
          assert m['design']['total_scientific_calls']==12288
          assert m['interface']['model']=='openai/gpt-oss-120b via Groq'
          assert m['frozen_vertex_split']['anchors'].startswith('8 vertices')
          assert m['governance']['repository_writeback_from_actions'] is False
          assert m['governance']['github_actions_bot_contribution']=='FORBIDDEN'
          d=json.load(open('receipts/p55_source/p55_result.json'))
          assert d['stage']=='EPISTEME-P55'
          assert d['estimand_identifiability']['by_model_task']['gptoss120']['PROTOCOL_ORDER']['identified_vertices']==31
          print('P57_SOURCE_PRECHECK_PASS')
          PY
      - name: Run frozen interaction-basis transport experiment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p57_interaction_tensor.py receipts/p55_source/p55_result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p57-interaction-basis-transport-result
          path: receipts/p57_result.json
          retention-days: 14
