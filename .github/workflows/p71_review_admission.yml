name: EPISTEME P71 Blinded Review Admission Court
on:
  push:
    paths:
      - 'src/p71_review_handoff.py'
      - 'src/p71_switch_certificate.py'
      - 'src/p71_review_html.py'
      - 'src/p71_integration_court.py'
      - 'src/p71_endogenous_audit_court.py'
      - 'active/p71_endogenous_audit_p72_proposal.md'
      - 'src/p71_prepare_review_handoff.py'
      - 'src/p71_review_disagreement_court.py'
      - 'active/p71_research_program.md'
      - 'active/p71_paper_candidate_court.md'
      - '.github/workflows/p71_review_admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review_p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify genuine no-human-review honest code gates
        run: |
          python -m py_compile src/p71_review_handoff.py src/p71_switch_certificate.py src/p71_review_html.py
          PYTHONPATH=src python src/p71_review_handoff.py --self-test
          PYTHONPATH=src python src/p71_switch_certificate.py
          PYTHONPATH=src python src/p71_endogenous_audit_court.py
          PYTHONPATH=src python src/p71_review_html.py --self-test
      - name: Download frozen author original under CC BY-NC license
        run: |
          curl --fail --location --silent --show-error --max-time 120 --retry 1 \
            --max-filesize 5000000 \
            https://raw.githubusercontent.com/MichSchli/AVeriTeC/7c62d1ec8df3fb560d6efe2b85fa191135636f81/data/dev.json \
            --output private_original_averitec.json
      - name: Produce TWO distinct blinded human handoffs only on runner
        run: |
          PYTHONPATH=src python src/p71_review_handoff.py \
            --source private_original_averitec.json \
            --outdir PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED \
            --out receipts/p71_p0_readiness.json
          PYTHONPATH=src python src/p71_review_html.py \
            --masked PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED/reviewer_A_masked.json \
            --template PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED/reviewer_A_response_TEMPLATE.json \
            --out PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED/reviewer_A_offline.html
          PYTHONPATH=src python src/p71_review_html.py \
            --masked PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED/reviewer_B_masked.json \
            --template PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED/reviewer_B_response_TEMPLATE.json \
            --out PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED/reviewer_B_offline.html
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED')
          docs=[json.loads((root/f'reviewer_{k}_masked.json').read_text()) for k in ('A','B')]
          r=json.loads(Path('receipts/p71_p0_readiness.json').read_text())
          assert r['actual_human_reviews_received']==0 and r['expected_independent_human_judgments']==32
          assert len(docs[0]['cases'])==len(docs[1]['cases'])==16
          assert [x['case_id'] for x in docs[0]['cases']] != [x['case_id'] for x in docs[1]['cases']]
          assert all(not d['source_labels_or_justifications_visible'] for d in docs)
          assert all(not d['model_responses_visible'] for d in docs)
          assert all((root/f'reviewer_{k}_offline.html').stat().st_size>10000 for k in ('A','B'))
          print('P71_ORIGINAL_16_PACKET_A_B_MASKED_HANDOFF_PASS human_judgments=0 paid_calls=0')
          PY
      - name: Cross-audit both review tools and adversarial mock failure paths on ORIGINAL data
        run: |
          python -m py_compile src/p71_integration_court.py src/p71_prepare_review_handoff.py src/p71_review_disagreement_court.py
          PYTHONPATH=src python src/p71_prepare_review_handoff.py --self-test
          PYTHONPATH=src python src/p71_review_disagreement_court.py --self-test
          PYTHONPATH=src python src/p71_integration_court.py \
            --source private_original_averitec.json \
            --receipt receipts/p71_original_integration_court.json
      - name: Assert G-001 read-only Actions and no bot-authored Git writes
        run: |
          python - <<'PY'
          from pathlib import Path
          governance=Path("GOVERNANCE.md").read_text()
          workflow=Path(".github/workflows/p71_review_admission.yml").read_text()
          import re
          assert "G-001" in governance and "github-actions[bot]" in governance
          assert re.search(r"(?m)^permissions:\n  contents: read$",workflow)
          assert not re.search(r"(?m)^\s*contents: write\s*$",workflow)
          # Don't cause self-matching by putting whole forbidden shell snippets
          # literally in the audit command written inside this same workflow.
          prohibited=("git"+" push ", "git"+" commit ", "gh"+" pr merge")
          assert not any(x in workflow for x in prohibited)
          print("P71_G001_NO_BOT_AUTHOR_OR_WRITEBACK_PASS")
          PY
      - name: Remove all original/packet and sealed gold before publishing receipt
        run: |
          rm -rf PRIVATE_HUMAN_HANDOFF_NOT_UPLOADED private_original_averitec.json
          echo 'P71_ORIGINAL_EVIDENCE_NOT_UPLOADED'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p71-human-review-readiness-receipt-only
          path: |
            receipts/p71_p0_readiness.json
            receipts/p71_original_integration_court.json
          retention-days: 30
# No secrets, no models, no mock-human completion, no data mirrors.
