name: EPISTEME P18 main replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API SDKs
        run: pip install groq google-genai
      - name: Run Qwen main arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/p17_external_run.py --phase main --model qwen --out receipts/qwen_main.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p18-qwen-main
          path: receipts/qwen_main.json
          retention-days: 7

  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API SDKs
        run: pip install groq google-genai
      - name: Run Gemini main arm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/p17_external_run.py --phase main --model gemini --out receipts/gemini_main.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p18-gemini-main
          path: receipts/gemini_main.json
          retention-days: 7

  gptoss:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API SDKs
        run: pip install groq google-genai
      - name: Run GPT-OSS main arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/p17_external_run.py --phase main --model gptoss --out receipts/gptoss_main.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p18-gptoss-main
          path: receipts/gptoss_main.json
          retention-days: 7
