name: EPISTEME P49 technical recovery

on:
  push:
    paths:
      - "active/p49_recovery_trigger.txt"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call recovery preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p48_seed_fingerprints.py src/p49_recover.py
          PYTHONPATH=src python - <<'PY'
          from p49_recover import TARGET
          assert TARGET=={'seed':4932,'namespace':'old','vertex':'R_F_L','alias':'C','semantic':'valid','cell_index':36}
          print('P49_RECOVERY_PRECHECK_PASS')
          PY
      - name: Replay exactly one failed call
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p49_recover.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p49-technical-recovery
          path: receipts/p49_recovery.json
          retention-days: 7
