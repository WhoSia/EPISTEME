name: EPISTEME P53 cross-task measurement-law externalization
on:
  push:
    paths: ["active/p53_trigger.txt"]
permissions:
  contents: read
jobs:
  p53:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p53_cross_task.py
          python src/p53_cross_task.py --self-test
      - name: Run frozen P53 experiment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p53_cross_task.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p53-cross-task-measurement-law-result
          path: receipts/p53_result.json
          retention-days: 7
