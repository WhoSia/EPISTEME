name: EPISTEME P67 Paired Output-Channel Pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'active/p67_preflight_trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai numpy
      - name: Validate frozen pilot and parser
        run: |
          PYTHONPATH=src python -m py_compile src/p67_channels.py src/p67_pilot_worker.py src/p67_pilot_analyze.py src/p67_selftest.py
          PYTHONPATH=src python src/p67_channels.py
          PYTHONPATH=src python src/p67_selftest.py
          PYTHONPATH=src python - <<'PY'
          import json
          from p67_channels import N_CALLS
          m=json.load(open('active/p67_pilot_manifest.json'))
          assert m['design']['maximum_model_calls']==N_CALLS==384
          assert m['execution']['git_push'] is False
          print('P67_PRECOMMIT_PASS; model calls not made')
          PY
  pilot:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [BH1, BT1, DH1, DT1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai numpy
      - name: Run bounded randomized P67 pilot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: PYTHONPATH=src python src/p67_pilot_worker.py --task ${{ matrix.task }} --out receipts/p67/${{ matrix.task }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p67-pilot-${{ matrix.task }}
          path: receipts/p67/
          retention-days: 30
  analyze:
    if: github.event_name == 'workflow_dispatch' && always()
    needs: [preflight,pilot]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: p67-pilot-*
          path: receipts/p67_shards
          merge-multiple: true
      - name: Immutable pilot completeness and measurement analysis
        run: PYTHONPATH=src python src/p67_pilot_analyze.py --root receipts/p67_shards --out receipts/p67_pilot_result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p67-pilot-feasibility-result
          path: receipts/p67_pilot_result.json
          retention-days: 30
