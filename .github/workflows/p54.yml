name: EPISTEME P54 failed-cell-only technical recovery
on:
  push:
    paths: ["active/p54_trigger.txt"]
permissions:
  contents: read
  actions: read
concurrency:
  group: episteme-p54-single-recovery
  cancel-in-progress: false
jobs:
  p54:
    if: github.run_attempt == 1 && github.run_number == 2
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: p53-cross-task-measurement-law-result
          repository: WhoSia/EPISTEME
          run-id: 36977540899
          github-token: ${{ github.token }}
          path: receipts/p53_source
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen integrity gate
        run: |
          python -m py_compile src/p54_recover.py src/p53_cross_task.py
          python -c "import hashlib,json,pathlib; p=pathlib.Path('receipts/p53_source/p53_result.json'); h=hashlib.sha256(p.read_bytes()).hexdigest(); assert h=='3b5ad9e09476c8d4a3d0871f3ba3fb8d687e69d3c0ca825b241cf50bc2952e13',h; d=json.loads(p.read_text()); assert d['constitutional_verdict']=='TECHNICAL_HOLD'; assert len(d['raw_rows'])==12288"
      - name: Replay only the 441 frozen failed rows once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p54_recover.py receipts/p53_source/p53_result.json receipts/p54_result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p54-cross-task-technical-recovery-result
          path: receipts/p54_result.json
          retention-days: 14

