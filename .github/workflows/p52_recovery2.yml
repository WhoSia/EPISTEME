name: EPISTEME P52 technical recovery 2

on:
  push:
    paths:
      - "active/p52_recovery2_trigger.txt"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - run: python -m py_compile src/p52_recover2.py
      - name: Replay one remaining failed P52 call
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p52_recover2.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p52-technical-recovery-2
          path: receipts/p52_recovery2.json
          retention-days: 7
