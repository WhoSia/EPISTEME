name: EPISTEME P69 Offline Instrument Court
on:
  workflow_dispatch:
  push:
    paths:
      - active/p69_offline_trigger.txt
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit independent packet factory and evidence-based scorer
        run: |
          python -m py_compile src/p69_task_factory.py src/p69_independent_scorer.py src/p69_offline_audit.py src/p69_predictive_analysis.py
          python src/p69_offline_audit.py
          python src/p69_predictive_analysis.py
      - name: Export deterministic label-hidden PREVIEW, not a blinded trial
        run: python src/p69_blind_adjudication.py --preview --public receipts/p69_annotation_preview.jsonl
      - name: Upload preview only; no ground truth or secret used
        uses: actions/upload-artifact@v4
        with:
          name: p69-annotation-preview-NOT-BLIND
          path: receipts/p69_annotation_preview.jsonl
          retention-days: 30
# No GitHub writeback, secrets, provider calls, or bot-authored commits.
