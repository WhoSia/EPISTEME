name: EPISTEME P23 failure-geometry replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run Qwen P23 arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p23_run.py --model qwen --out receipts/qwen_p23.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p23-qwen
          path: receipts/qwen_p23.json
          retention-days: 7

  gemini:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run Gemini P23 arm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p23_run.py --model gemini --out receipts/gemini_p23.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p23-gemini
          path: receipts/gemini_p23.json
          retention-days: 7

  gptoss:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run GPT-OSS P23 arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p23_run.py --model gptoss --out receipts/gptoss_p23.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p23-gptoss
          path: receipts/gptoss_p23.json
          retention-days: 7
