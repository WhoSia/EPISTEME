name: EPISTEME P51 technical recovery

on:
  push:
    paths:
      - "active/p51_recovery_trigger.txt"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call recovery preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p48_seed_fingerprints.py src/p51_recover.py
          PYTHONPATH=src python - <<'PY'
          from p51_recover import TARGETS
          assert len(TARGETS)==19
          assert sum(t['model']=='gptoss120' for t in TARGETS)==18
          assert sum(t['model']=='gemini' for t in TARGETS)==1
          print('P51_RECOVERY_PRECHECK_PASS')
          PY
      - name: Replay only failed P51 calls
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p51_recover.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p51-technical-recovery
          path: receipts/p51_recovery.json
          retention-days: 7
