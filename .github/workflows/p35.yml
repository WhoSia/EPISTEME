name: EPISTEME P35 construction-effect transport

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p35_trigger.txt"
      - "src/p35_run.py"
      - ".github/workflows/p35.yml"

permissions:
  contents: read

jobs:
  gemini:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run P35 phased prospective transport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p35_run.py --out receipts/gemini_p35.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p35-gemini
          path: receipts/
          retention-days: 7
