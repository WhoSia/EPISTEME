name: EPISTEME P73 P5 P69 P70 Independent Audit and Review Readiness
on:
  push:
    paths:
      - 'src/p73_p5_prospective_audit_design.py'
      - 'src/p69_external_holdout_scorer_handoff.py'
      - 'src/p70_full_vs_projected_review.py'
      - 'active/p73_p5_p69_p70_independent_validation.md'
      - '.github/workflows/p73_p5_independent_validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective_no_field_intervention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prospective noninterference panel validity and negative falsifiers
        run: |
          PYTHONPATH=src python src/p73_p5_prospective_audit_design.py > p73_testlog.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=Path('p73_testlog.json').read_text()
          result=json.loads(x[x.index('{'):])
          assert result['causal_effect'].startswith('HOLD')
          assert result['real_field_sources']==0
          assert result['paid_model_calls']==0
          Path('receipts').mkdir(exist_ok=True)
          Path('receipts/p73_p5_design_only.json').write_text(json.dumps(result,indent=2)+'\n')
          print('P73_P5_NO_REAL_INTERVENTIONS_DESIGN_GATE_PASS')
          PY
      - name: G-001 read-only workflow and no git bot writes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('.github/workflows/p73_p5_independent_validation.yml').read_text()
          governance=Path('GOVERNANCE.md').read_text()
          assert 'G-001' in governance
          assert re.search(r'(?m)^permissions:\n  contents: read$',s)
          assert not any(x.strip()==('contents:'+' write') for x in s.splitlines())
          prohibited=('git'+' push ', 'git'+' commit ', 'gh'+' pr merge')
          assert not any(x in s for x in prohibited)
          print('P73_P5_G001_NO_ACTIONS_WRITE_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p73-p5-design-only-epistemic-limits
          path: receipts/p73_p5_design_only.json
  p69_external_holdout_readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai
      - name: Download original SciFact source and verify with original compiler
        run: |
          set -euo pipefail
          mkdir -p PRIVATE_SOURCE PRIVATE_REVIEW receipts
          curl --fail --location --silent --show-error --max-time 120 --retry 1 --max-filesize 50000000 \
            https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz \
            --output PRIVATE_SOURCE/scifact.tar.gz
          python - <<'PY'
          import tarfile
          with tarfile.open('PRIVATE_SOURCE/scifact.tar.gz','r:gz') as tar:
              tar.extractall('PRIVATE_SOURCE/unpacked',filter='data')
          PY
          test "$(find PRIVATE_SOURCE -name claims_dev.jsonl | wc -l)" -eq 1
          test "$(find PRIVATE_SOURCE -name corpus.jsonl | wc -l)" -eq 1
      - name: Independent external original claim/doc holdout and scorer protocol
        run: |
          PYTHONPATH=src python src/p69_external_holdout_scorer_handoff.py --self-test
          PYTHONPATH=src python src/p69_external_holdout_scorer_handoff.py \
            --claims "$(find PRIVATE_SOURCE -name claims_dev.jsonl)" \
            --corpus "$(find PRIVATE_SOURCE -name corpus.jsonl)" \
            --outdir PRIVATE_REVIEW/P69             --receipt receipts/p69_eight_external_holdout_counts.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('receipts/p69_eight_external_holdout_counts.json').read_text())
          assert x['external_holdout_claim_clusters']==8
          assert x['claims_or_documents_reused_from_p70']==0
          assert x['actual_independent_scorer_judgments']==0
          assert x['dataset_ecologies']==1 and x['model_calls']==0
          print('P69_EIGHT_EXTERNAL_HELDOUT_SOURCE_CASES_PASS scorer_humans=0')
          PY
      - name: Remove original source and private review panels
        if: always()
        run: rm -rf PRIVATE_SOURCE PRIVATE_REVIEW
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p69-eight-heldout-original-clusters-scorer-readiness-only
          path: receipts/p69_eight_external_holdout_counts.json
  p70_full_vs_projected_readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact original AVeriTeC source without writing back
        run: |
          set -euo pipefail
          mkdir -p PRIVATE_SOURCE PRIVATE_REVIEW receipts
          curl --fail --location --silent --show-error --max-time 120 --retry 1 --max-filesize 5000000 \
            https://raw.githubusercontent.com/MichSchli/AVeriTeC/7c62d1ec8df3fb560d6efe2b85fa191135636f81/data/dev.json \
            --output PRIVATE_SOURCE/averitec_original.json
      - name: Four-panel full versus projected independent review contract
        run: |
          PYTHONPATH=src python src/p70_full_vs_projected_review.py --self-test
          PYTHONPATH=src python src/p70_full_vs_projected_review.py \
            --source PRIVATE_SOURCE/averitec_original.json \
            --outdir PRIVATE_REVIEW/P70             --receipt receipts/p70_full_vs_projected_review_counts.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('receipts/p70_full_vs_projected_review_counts.json').read_text())
          q=x['original_question_census']
          assert q['original_questions']==10 and q['projection_retained_qa']==8
          assert q['original_questions_beyond_projection']==2
          assert x['actual_human_judgments']==0
          assert x['requested_additional_human_judgments']==16
          assert x['P71_existing_16x2_human_judgments']==0
          print('P70_FULL_VS_PROJECTED_FOUR_PANEL_READINESS_PASS human_scores=0')
          PY
      - name: Destroy licensed source and private masked review material
        if: always()
        run: rm -rf PRIVATE_SOURCE PRIVATE_REVIEW
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p70-full-original-vs-projected-qa-handoff-counts-only
          path: receipts/p70_full_vs_projected_review_counts.json
# No commercial providers, no sample claims in artifacts, and no recruitment.
,s)
          prohibited=('git'+' push ', 'git'+' commit ', 'gh'+' pr merge')
          assert not any(x in s for x in prohibited)
          print('P73_P5_G001_NO_ACTIONS_WRITE_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p73-p5-design-only-epistemic-limits
          path: receipts/p73_p5_design_only.json
