name: EPISTEME P46 latent stochastic regime mixtures

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p46_trigger.txt"

permissions:
  contents: read

jobs:
  p46:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p46_regimes.py
          python - <<'PY'
          import json
          m=json.load(open('active/p46_manifest.json'))
          assert m['stage']=='EPISTEME-P46'
          assert m['predecessor']['canonical_run']==36501312148
          assert m['frozen_surface']['waves']==8
          assert m['design']['total_scientific_calls']==4096
          assert m['primary_estimands']['null_engine'].startswith('5000')
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P46_PRECHECK_PASS')
          PY
      - name: Run frozen stochastic-regime experiment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p46_regimes.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p46-latent-regime-mixture-result
          path: receipts/p46_result.json
          retention-days: 7
