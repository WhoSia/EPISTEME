name: EPISTEME P20 conjunctive-factorial replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run Qwen P20 arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p20_run.py --model qwen --out receipts/qwen_p20.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p20-qwen
          path: receipts/qwen_p20.json
          retention-days: 7

  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run Gemini P20 arm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p20_run.py --model gemini --out receipts/gemini_p20.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p20-gemini
          path: receipts/gemini_p20.json
          retention-days: 7

  gptoss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run GPT-OSS P20 arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p20_run.py --model gptoss --out receipts/gptoss_p20.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p20-gptoss
          path: receipts/gptoss_p20.json
          retention-days: 7
