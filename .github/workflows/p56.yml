name: EPISTEME P56 exact completion-lattice court

on:
  push:
    paths:
      - "active/p56_trigger.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: episteme-p56-single-court
  cancel-in-progress: false

jobs:
  p56:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: p55-access-regime-estimand-salvage-result
          repository: WhoSia/EPISTEME
          run-id: 37006966589
          github-token: ${{ github.token }}
          path: receipts/p55_source
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p56_completion_lattice.py src/p53_cross_task.py
          python src/p56_completion_lattice.py --self-test
          python - <<'PY'
          import json
          m=json.load(open('active/p56_manifest.json'))
          assert m['stage']=='EPISTEME-P56'
          assert m['scope']['provider_calls']==0
          assert m['scope']['scientific_cell_replays']==0
          assert m['completion_lattice']['worlds']==64
          d=json.load(open('receipts/p55_source/p55_result.json'))
          assert d['stage']=='EPISTEME-P55'
          assert d['estimand_identifiability']['gemini_identified_tau']==90
          assert d['estimand_identifiability']['gemini_total_tau']==96
          print('P56_SOURCE_PRECHECK_PASS')
          PY
      - name: Enumerate all 64 admissible primary worlds
        run: python src/p56_completion_lattice.py receipts/p55_source/p55_result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p56-exact-completion-lattice-result
          path: receipts/p56_result.json
          retention-days: 14
