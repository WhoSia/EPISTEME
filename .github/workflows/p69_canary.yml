name: EPISTEME P69 Provider Contract Canary
on:
  workflow_dispatch:
  push:
    paths:
      - active/p69_canary_preflight_trigger.txt

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai
      - name: Zero-call P69 source and matrix audit
        run: |
          python -m py_compile src/p69_provider_canary.py src/p69_provider_canary_analyze.py src/p69_paper_preflight.py
          PYTHONPATH=src python src/p69_provider_canary.py --self-test
          PYTHONPATH=src python src/p69_paper_preflight.py
          echo 'P69_NO_PROVIDER_CALLS_ON_PUSH=PASS'

  canary:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [gptoss120, gemini]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai
      - name: Bounded two-contract provider canary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PYTHONPATH=src python src/p69_provider_canary.py --model ${{ matrix.model }} --out receipts/p69_canary/${{ matrix.model }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p69-contract-canary-${{ matrix.model }}
          path: receipts/p69_canary/
          retention-days: 30

  judge:
    if: github.event_name == 'workflow_dispatch' && always()
    needs: [preflight,canary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai
      - uses: actions/download-artifact@v4
        with:
          pattern: p69-contract-canary-*
          path: receipts/canary_shards
          merge-multiple: true
      - name: Fail-closed contract audit
        run: PYTHONPATH=src python src/p69_provider_canary_analyze.py --root receipts/canary_shards --out receipts/p69_contract_verdict.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p69-contract-canary-verdict
          path: receipts/p69_contract_verdict.json
          retention-days: 30

# Strictly read-only; no commit/push steps or github-actions[bot] authorship.
# The push trigger executes ONLY provider-free preflight.
# workflow_dispatch incurs up to four logical model invocations (two per provider).
