name: EPISTEME P39 Groq Qwen lineage screen

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p39_trigger.txt"

permissions:
  contents: read

jobs:
  groq-qwen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq
      - name: Static preflight
        run: python -m py_compile src/p39_common.py src/p39_groq_screen.py
      - name: Discover and screen accessible Groq Qwen models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p39_groq_screen.py --out receipts/p39_groq_qwen_screen.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p39-groq-qwen-screen
          path: receipts/
          retention-days: 7
