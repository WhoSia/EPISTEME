name: EPISTEME P69 Gemini Model Metadata Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - active/p69_gemini_metadata_trigger.txt

permissions:
  contents: read
  actions: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install groq google-genai
      - name: Check Gemini account and model metadata (NO generation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=src python src/p69_gemini_metadata.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p69-gemini-metadata-diagnostic
          path: receipts/p69_gemini_metadata.json
          retention-days: 14
# Executes only a non-generative models.get metadata lookup.
# Does NOT send prompts, consume model generations, or create git commits.
