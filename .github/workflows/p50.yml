name: EPISTEME P50 randomization-marginal measurement

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p50_trigger.txt"

permissions:
  contents: read

jobs:
  p50:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p48_seed_fingerprints.py src/p50_marginal_measurement.py
          python src/p50_marginal_measurement.py --self-test
          python - <<'PY'
          import json
          m=json.load(open('active/p50_manifest.json'))
          assert m['stage']=='EPISTEME-P50'
          assert m['predecessor']['canonical_scientific_run']==36654796963
          assert m['design']['draws_per_model']==32
          assert m['design']['total_scientific_calls']==4096
          assert m['design']['nested_estimator_prefixes']==[1,2,4,8,16]
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P50_MANIFEST_PRECHECK_PASS')
          PY
      - name: Run frozen cross-interface marginal measurement experiment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p50_marginal_measurement.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p50-randomization-marginal-measurement-result
          path: receipts/p50_result.json
          retention-days: 7
