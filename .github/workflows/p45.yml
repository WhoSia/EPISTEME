name: EPISTEME P45 fixed-alias prospective replay

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p45_trigger.txt"

permissions:
  contents: read

jobs:
  p45:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p45_replay.py
          python - <<'PY'
          import json
          m=json.load(open('active/p45_manifest.json'))
          assert m['stage']=='EPISTEME-P45'
          assert m['predecessor']['canonical_run']==36394059097
          assert m['frozen_surface']['fresh_replicates']==4
          assert m['design']['total_scientific_calls']==2048
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P45_PRECHECK_PASS')
          PY
      - name: Run frozen fixed-alias prospective replay
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p45_replay.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p45-fixed-alias-predictive-persistence-result
          path: receipts/p45_result.json
          retention-days: 7
