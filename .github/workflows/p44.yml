name: EPISTEME P44 stochastic susceptibility field

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p44_trigger.txt"

permissions:
  contents: read

jobs:
  p44:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py
          python - <<'PY'
          import json
          m=json.load(open('active/p44_manifest.json'))
          assert m['stage']=='EPISTEME-P44'
          assert m['design']['fresh_archive_alias_blocks']==4
          assert m['design']['replicates_per_alias_block']==2
          assert m['design']['total_scientific_calls']==1024
          assert m['spectral_analysis']['null_test'].startswith('5000')
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P44_PRECHECK_PASS')
          PY
      - name: Run frozen stochastic field experiment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p44_field.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p44-stochastic-susceptibility-field-result
          path: receipts/p44_result.json
          retention-days: 7
