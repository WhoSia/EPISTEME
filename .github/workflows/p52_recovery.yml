name: EPISTEME P52 technical recovery

on:
  push:
    paths:
      - "active/p52_recovery_trigger.txt"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call final recovery preflight
        run: |
          python -m py_compile src/p52_recover.py
          python - <<'PY'
          import ast
          src=open('src/p52_recover.py').read()
          assert "'draw':26" in src and "'cell_index':27" in src
          print('P52_FINAL_RECOVERY_PRECHECK_PASS')
          PY
      - name: Replay one remaining failed P52 call
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p52_recover.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p52-technical-recovery
          path: receipts/p52_recovery.json
          retention-days: 7
