name: EPISTEME P17 blind replay

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "calibration first; run main only after calibration receipts pass"
        required: true
        default: calibration
        type: choice
        options:
          - calibration
          - main
      arm:
        description: "which participant arm to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - qwen
          - gemini
          - gptoss
      include_confirmatory:
        description: "include GPT-OSS confirmatory arm when arm=all"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  qwen:
    if: ${{ inputs.arm == 'all' || inputs.arm == 'qwen' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API SDKs
        run: pip install groq google-genai
      - name: Run Qwen arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/p17_external_run.py --phase "${{ inputs.phase }}" --model qwen --out "receipts/qwen_${{ inputs.phase }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p17-qwen-${{ inputs.phase }}
          path: receipts/
          retention-days: 7

  gemini:
    if: ${{ inputs.arm == 'all' || inputs.arm == 'gemini' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API SDKs
        run: pip install groq google-genai
      - name: Run Gemini arm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/p17_external_run.py --phase "${{ inputs.phase }}" --model gemini --out "receipts/gemini_${{ inputs.phase }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p17-gemini-${{ inputs.phase }}
          path: receipts/
          retention-days: 7

  gptoss:
    if: ${{ inputs.arm == 'gptoss' || (inputs.arm == 'all' && inputs.include_confirmatory) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API SDKs
        run: pip install groq google-genai
      - name: Run GPT-OSS confirmatory arm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/p17_external_run.py --phase "${{ inputs.phase }}" --model gptoss --out "receipts/gptoss_${{ inputs.phase }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p17-gptoss-${{ inputs.phase }}
          path: receipts/
          retention-days: 7
