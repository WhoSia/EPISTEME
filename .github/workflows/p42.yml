name: EPISTEME P42 contract equalization and selectivity reopening

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p42_trigger.txt"

permissions:
  contents: read

jobs:
  p42:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Zero-call static preflight
        run: |
          python -m py_compile src/p42_reopen.py
          python - <<'PY'
          import json
          m=json.load(open('active/p42_manifest.json'))
          assert m['stage']=='EPISTEME-P42'
          assert m['phase_A_contract_calibration']['scientific_packets']==0
          assert m['phase_B_fresh_boundary_replication']['replicates_per_group']==5
          assert len(m['phase_B_fresh_boundary_replication']['seeds'])==5
          print('P42_PRECHECK_PASS')
          PY
      - name: Run frozen contract calibration, fresh replication and conditional geometry
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p42_reopen.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p42-contract-equalized-result
          path: receipts/p42_result.json
          retention-days: 7
