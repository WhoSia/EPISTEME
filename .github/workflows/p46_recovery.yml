name: EPISTEME P46 technical recovery

on:
  push:
    paths:
      - "active/p46_recovery_trigger.txt"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Zero-call recovery preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p46_recover.py
          PYTHONPATH=src python - <<'PY'
          from p46_recover import FAILED
          assert sum(map(len,FAILED.values()))==11
          print('P46_RECOVERY_PRECHECK_PASS')
          PY
      - name: Replay only technical failures
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p46_recover.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p46-technical-recovery
          path: receipts/p46_recovery.json
          retention-days: 7
