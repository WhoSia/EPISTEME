name: EPISTEME P51 measurement sufficiency field

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p51_trigger.txt"

permissions:
  contents: read

jobs:
  p51:
    runs-on: ubuntu-24.04
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p48_seed_fingerprints.py src/p51_sufficiency.py
          python src/p51_sufficiency.py --self-test
          python - <<'PY'
          import json
          m=json.load(open('active/p51_manifest.json'))
          assert m['stage']=='EPISTEME-P51'
          assert m['predecessor']['canonical_scientific_run']==36659547849
          assert m['design']['draws_per_model']==64
          assert m['design']['total_scientific_calls']==8192
          assert m['design']['resolution_ladder_full_width']==[0.5,0.4,0.3]
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P51_MANIFEST_PRECHECK_PASS')
          PY
      - name: Run frozen sequential measurement-sufficiency experiment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/p51_sufficiency.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p51-measurement-sufficiency-field-result
          path: receipts/p51_result.json
          retention-days: 7
