name: EPISTEME P39 CPU Qwen lineage screen

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p39_cpu_trigger.txt"

permissions:
  contents: read

jobs:
  cpu-qwen:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install torch transformers accelerate
      - name: Static preflight
        run: python -m py_compile src/p39_common.py src/p39_cpu_screen.py
      - name: Screen small official Qwen checkpoints on CPU
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python src/p39_cpu_screen.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p39-cpu-qwen-screen
          path: receipts/
          retention-days: 7
