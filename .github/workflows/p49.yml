name: EPISTEME P49 seed-response manifold identifiability

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p49_trigger.txt"

permissions:
  contents: read

jobs:
  p49:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai numpy
      - name: Zero-call frozen preflight
        run: |
          python -m py_compile src/p42_reopen.py src/p44_field.py src/p48_seed_fingerprints.py src/p49_manifold.py
          python src/p49_manifold.py --self-test
          python - <<'PY'
          import json
          m=json.load(open('active/p49_manifest.json'))
          assert m['stage']=='EPISTEME-P49'
          assert m['predecessor']['canonical_run']==36646456304
          assert m['seed_sets']['nested_prefixes']==[4,8,16,32]
          assert m['design']['total_scientific_calls']==4096
          assert '48 cells' in m['cell_partition']['train_cells']
          assert '16 cells' in m['cell_partition']['heldout_cells']
          assert m['execution_governance']['repository_writeback_from_actions'] is False
          assert m['execution_governance']['github_actions_bot_contribution']=='FORBIDDEN'
          print('P49_MANIFEST_PRECHECK_PASS')
          PY
      - name: Run frozen seed-manifold experiment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p49_manifold.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p49-seed-response-manifold-result
          path: receipts/p49_result.json
          retention-days: 7
