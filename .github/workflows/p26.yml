name: EPISTEME P26 heldout exceptional-vertex stability

on:
  workflow_dispatch:
  push:
    paths:
      - "active/p26_trigger.txt"

permissions:
  contents: read

jobs:
  gemini:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install groq google-genai
      - name: Run Gemini P26 heldout boundary validation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/p26_run.py --out receipts/gemini_p26.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p26-gemini
          path: receipts/gemini_p26.json
          retention-days: 7
