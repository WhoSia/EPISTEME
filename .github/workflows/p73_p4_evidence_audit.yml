name: EPISTEME P69 P70 P73 P4 Real-Evidence Audit
on:
  push:
    paths:
      - 'src/p69_p70_frozen_paper_court.py'
      - 'src/p73_p4_source_snapshot_court.py'
      - 'active/p73_p4_p69_p70_joint_research_court.md'
      - '.github/workflows/p73_p4_evidence_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_historical_provider_rows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch frozen ACTUAL provider artifacts read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p receipts/historical/pilot receipts/historical/r1 receipts/historical/p70
          for model in gemini gptoss120; do
            gh run download 37925719478 --repo "$GITHUB_REPOSITORY" \
              --name "p69-instrument-pilot-$model" \
              --dir "receipts/historical/pilot/$model"
            gh run download 37931512662 --repo "$GITHUB_REPOSITORY" \
              --name "p69-r1-resumed-calibration-$model" \
              --dir "receipts/historical/r1/$model"
          done
          gh run download 37929439637 --repo "$GITHUB_REPOSITORY" \
            --name p70-independent-source-pilot-receipts \
            --dir receipts/historical/p70
          test "$(find receipts/historical/pilot -name '*.json' | wc -l)" -eq 2
          test "$(find receipts/historical/r1 -name '*.json' | wc -l)" -eq 2
          echo 'P69_P70_REAL_HISTORICAL_ARTIFACT_CUSTODY_PASS'
      - name: Reanalyze original 192+64+32 hosted responses without reruns
        run: |
          PYTHONPATH=src python src/p69_p70_frozen_paper_court.py \
            --pilot receipts/historical/pilot --repair receipts/historical/r1 \
            --scifact receipts/historical/p70 \
            --out receipts/p69_p70_original_forensic.json
      - name: Drop provider row-level strings before uploading
        if: always()
        run: rm -rf receipts/historical
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p69-p70-frozen-original-paper-audit-counts-only
          path: receipts/p69_p70_original_forensic.json
          retention-days: 30
  original_ecology_warrant_boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original compiler import dependencies without provider calls
        run: python -m pip install groq google-genai
      - name: Fetch original version-pinned AVeriTeC twice with no side effects
        run: |
          set -euo pipefail
          mkdir -p private-source receipts source
          for copy in before after; do
            curl --fail --location --silent --show-error --max-time 120 --retry 1 \
              --max-filesize 5000000 \
              https://raw.githubusercontent.com/MichSchli/AVeriTeC/7c62d1ec8df3fb560d6efe2b85fa191135636f81/data/dev.json \
              --output "private-source/averitec-$copy.json"
          done
          curl --fail --location --silent --show-error --max-time 120 --retry 1 \
            --max-filesize 50000000 \
            https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz \
            --output private-source/original-scifact.tar.gz
          python - <<'PY'
          import tarfile
          with tarfile.open('private-source/original-scifact.tar.gz','r:gz') as z:
              z.extractall('source',filter='data')
          print('P73_P4_TWO_ORIGINAL_CORPORA_FETCHED')
          PY
      - name: Quantify original-source provenance and fail-closed semantic limits
        run: |
          python -m py_compile src/p73_p4_source_snapshot_court.py
          find source -name claims_dev.jsonl -type f > private-source/claim_paths
          find source -name corpus.jsonl -type f > private-source/corpus_paths
          test "$(wc -l < private-source/claim_paths)" -eq 1
          test "$(wc -l < private-source/corpus_paths)" -eq 1
          PYTHONPATH=src python src/p73_p4_source_snapshot_court.py \
            --before private-source/averitec-before.json \
            --after private-source/averitec-after.json \
            --claims "$(cat private-source/claim_paths)" \
            --corpus "$(cat private-source/corpus_paths)" \
            --out receipts/p73_p4_source_p70_partial_bridge.json
      - name: Delete original copyrighted evidence before any artifact export
        if: always()
        run: rm -rf private-source source
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p73-p4-original-source-p70-bridge-counts-only
          path: receipts/p73_p4_source_p70_partial_bridge.json
          retention-days: 30
# G-001: all Jobs read-only, no Git writes. No model requests or human enrollment.
